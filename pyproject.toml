[project]
name = "arbol-codex-driver"
version = "1.0.0"
description = "Arbol Codex Driver: the Arbol 2 Driver for Codex."
requires-python = "==3.14.8"
dependencies = []

[dependency-groups]
dev = ["mypy==1.19.1", "ruff==0.14.14"]

[tool.uv]
package = false

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = ["src", "scripts"]
files = ["src/arbol_codex_driver", "tests", "scripts", "bin/entry.py"]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ASYNC"]
# RPC deadlines include writes; subprocess exit observation must not wait on descendant-held pipes.
ignore = ["ASYNC109", "ASYNC110"]
